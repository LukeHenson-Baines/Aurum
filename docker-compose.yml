services:
  postgres:
    image: postgres:17
    container_name: aurum-postgres
    environment:
      POSTGRES_DB: aurum
      POSTGRES_USER: aurum
      POSTGRES_PASSWORD: aurum
    ports:
      - "5432:5432"
    volumes:
      - aurum-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurum -d aurum"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aurum-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/aurum
      SPRING_DATASOURCE_USERNAME: aurum
      SPRING_DATASOURCE_PASSWORD: aurum
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080/api
    container_name: aurum-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  aurum-postgres-data: